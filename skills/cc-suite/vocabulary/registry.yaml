# Machine-readable vocabulary registry for cc-suite.
#
# Seeded by /nlpm:vocab-init on 2026-05-26. Pruned during initial
# migration: only deprecation pairs that can be **cleanly enforced**
# without false positives are listed below. Other observed drift
# (issue↔finding, agent↔advisor, etc.) is documented in SKILL.md as
# convention only — see "Why some pairs are convention-only" there.
#
# Read by /nlpm:check and /nlpm:score when R51 is enabled in
# .claude/nlpm.local.md.

scopes:
  - id: internal
    description: |
      The cc-suite bridge subsystem — commands, skills, advisor preset
      templates, AGENTS.md, hooks, scripts. There is no "auditor" scope
      because cc-suite delegates audit work to Codex via shared skills.
    paths:
      - commands/
      - skills/cc-suite/
      - templates/agents/
      - AGENTS.md

# Verbs that mean the same in any scope. cc-suite has only one scope,
# so this list is empty by construction.
cross_scope_homonyms:
  verbs: []

verbs:
  internal:
    - canonical: audit
      definition: Structured multi-dimension code/artifact scan with severity table (Codex-delegated).
      deprecated: []

    - canonical: bridge
      definition: Umbrella verb for making one tool's config visible to another.
      deprecated: []

    - canonical: refresh
      definition: Bring an artifact, configuration, or knowledge resource to the currently-expected state. Includes the `mcp_claude.sh` rewrite-in-place behavior, the `/cc-suite:update` re-render flow, and `/cc-suite:refresh-knowledge`.
      deprecated:
        - freshen   # implementation-internal term; use `refresh` everywhere

    - canonical: update
      definition: User-side coupled re-render after `claude plugin update cc-suite`. Distinct from `refresh` (broader) in that `update` names the slash command.
      deprecated: []

    - canonical: init
      definition: First-time project setup of all cc-suite bridge artifacts.
      deprecated: []

    - canonical: check
      definition: Lightweight prerequisite / connectivity probe.
      deprecated: []

    - canonical: consult
      definition: Invoke a cc-suite advisor agent via MCP and receive its judgment.
      deprecated: []

    - canonical: delegate
      definition: Forward a task to Claude Code via mcp__claude-code__claude_code.
      deprecated: []

    - canonical: fix
      definition: Code-level remediation of a specific reported defect.
      deprecated: []

    - canonical: repair
      definition: Non-interactive re-run of all cc-suite bridge / registration scripts. Distinct from `fix` — `fix` = code, `repair` = infrastructure.
      deprecated: []

    - canonical: verify
      definition: Confirm a prior code-fix outcome via Claude MCP.
      deprecated: []

    - canonical: register
      definition: Persist an MCP server entry into .mcp.json or .codex/config.toml.
      deprecated: []

    - canonical: expose
      definition: Symlink-based sub-operation of bridge for cc-suite plugin skills.
      deprecated: []

    - canonical: mirror
      definition: One-directional copy sub-operation of bridge for hooks and MCP.
      deprecated: []

    - canonical: setup
      definition: Higher-level user activity composed of init + configure + verify.
      deprecated: []

    - canonical: add
      definition: CRUD verb for creating a new entry under .cc-suite/agents/.
      deprecated: []

    - canonical: remove
      definition: CRUD verb for deleting an entry under .cc-suite/agents/.
      deprecated: []

    - canonical: list
      definition: CRUD verb for enumerating entries under .cc-suite/agents/.
      deprecated: []

    - canonical: cancel
      definition: Stop a running Codex background job.
      deprecated: []

    - canonical: continue
      definition: Resume a previous Codex thread.
      deprecated: []

    - canonical: implement
      definition: Send an implementation plan to Codex for full autonomous execution.
      deprecated: []

    - canonical: analyze
      definition: Root-cause analysis for a bug or failing test, delegated to Codex.
      deprecated: []

    - canonical: status
      definition: Show active/recent Codex jobs and their phases.
      deprecated: []

    - canonical: result
      definition: Fetch stored output from a completed Codex job.
      deprecated: []

    - canonical: review
      definition: Send a plan or PR to Codex for architectural review. Distinct from `consult` (advisor invocation).
      deprecated: []

    - canonical: plan
      definition: Ask Claude Code to produce an implementation plan.
      deprecated: []

    - canonical: preflight
      definition: Verify Codex connectivity and discover available models before delegation.
      deprecated: []

    - canonical: unbridge
      definition: Tear down the cc-suite bridge artifacts (inverse of init + repair).
      deprecated: []

nouns:
  artifact_class:
    - canonical: advisor
      definition: A project-scoped value-over-rules persona declared in .cc-suite/agents/, backed by claude-octopus as a separately-configured MCP server. (See SKILL.md for why `agent` is NOT in the deprecated list.)
      deprecated: []

    - canonical: subagent
      definition: A Claude Code Task-tool spawned worker that executes focused work in isolated context.
      deprecated:
        - sub-agent

    - canonical: bridge
      definition: The cc-suite-managed subsystem that wires Claude/Codex/Gemini together.
      deprecated: []

    - canonical: finding
      definition: A single defect surfaced by an audit/review — file:line, severity, recommendation. (See SKILL.md for why `issue` is NOT in the deprecated list.)
      deprecated: []

    - canonical: dimension
      definition: A numbered axis the auditor scores artifacts against.
      deprecated:
        - pillar

    - canonical: sentinel block
      definition: The cc-suite-owned section in .codex/config.toml or .gitignore, delimited by sentinel comments.
      deprecated: []

    - canonical: thread
      definition: The Codex execution-continuation handle (the threadId MCP parameter).
      deprecated: []

    - canonical: registration
      definition: The persisted MCP server entry produced by bridge.
      deprecated: []

    - canonical: preset
      definition: A starter advisor agent file shipped under templates/agents/.
      deprecated: []

    - canonical: pin
      definition: The version string for claude-octopus in scripts/lib/claude-octopus-pin.txt.
      deprecated: []

    - canonical: timeline
      definition: The per-advisor persistent consultation history at .cc-suite/agents/<name>/timeline/.
      deprecated: []

    - canonical: artifact
      definition: A file cc-suite owns — command, skill, agent, hook, manifest, config.
      deprecated: []

    - canonical: script
      definition: An executable under scripts/ — bash, python, or mjs.
      deprecated: []

  # Persona suffixes for advisor preset names. NOT drift.
  role_nouns:
    - canonical: advisor
      stance: General-purpose value advisor; broad-scope judgment.
    - canonical: reviewer
      stance: Reviews finished work against a single quality dimension.
    - canonical: critic
      stance: Judges the output of an upstream process (typically docs).
    - canonical: advocate
      stance: Argues for one specific action over alternatives.
    - canonical: skeptic
      stance: Adversarial reviewer; assumes hostile inputs / worst case.

rejected_pending_warrant: []
